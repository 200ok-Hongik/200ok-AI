services:
  - type: web
    name: recycle-ai-server
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: YOLO_MODEL_PATH
        value: models/best.pt
      - key: YOLO_IMG_SIZE
        value: "640"
      - key: YOLO_CONF_THRESHOLD
        value: "0.25"
